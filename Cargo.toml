[package]
name = "arch-browser"
version = "0.1.1"
edition = "2021"
description = "Privacy-focused minimalist Chromium desktop browser for Linux, powered by CEF and Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/1-RageNova-1/arch-browser"
readme = "README.md"
keywords = ["browser", "cef", "chromium", "linux", "privacy", "adblock"]
categories = ["gui"]

[lib]
name = "arch_browser"
path = "src/lib.rs"

[dependencies]
adblock = "0.13.6"
cef = "156.7"
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
