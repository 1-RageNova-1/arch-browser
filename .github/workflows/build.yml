name: Build Linux

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libnss3 \
            libatk-bridge2.0-0 \
            libdrm2 \
            libxkbcommon0 \
            libgbm1 \
            libasound2t64 || sudo apt-get install -y libasound2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check
        run: cargo check

      - name: Build (release)
        run: cargo build --release
        continue-on-error: true   # CEF download / linking can still fail; keep the job informative

      - name: Upload binary (if produced)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arch-browser-linux
          path: |
            target/release/arch-browser
          if-no-files-found: ignore
          retention-days: 7

      - name: Summary
        run: |
          echo "### Arch Browser build summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This workflow only compiles the current skeleton." >> $GITHUB_STEP_SUMMARY
          echo "It does **not** yet produce a complete, tested browser." >> $GITHUB_STEP_SUMMARY
          echo "See README.md for the real status of the project." >> $GITHUB_STEP_SUMMARY
