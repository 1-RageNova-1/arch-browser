name: Linux CI

on:
  push:
    branches: [main, "work/**"]
  workflow_dispatch:

concurrency:
  group: linux-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Validate release signing key without exposing it
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [[ -z "${APT_GPG_PRIVATE_KEY:-}" ]]; then
            echo "::error::APT_GPG_PRIVATE_KEY is missing from repository Actions secrets."
            exit 1
          fi
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import >/dev/null 2>&1
          FINGERPRINT="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          if [[ -z "$FINGERPRINT" ]]; then
            echo "::error::The configured secret did not import a usable private signing key."
            exit 1
          fi
          printf 'Arch Browser signing-key validation probe\n' > "$RUNNER_TEMP/signing-probe.txt"
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "${APT_GPG_PASSPHRASE:-}" \
            --local-user "$FINGERPRINT" --armor --detach-sign \
            --output "$RUNNER_TEMP/signing-probe.txt.asc" "$RUNNER_TEMP/signing-probe.txt"
          gpg --batch --verify "$RUNNER_TEMP/signing-probe.txt.asc" "$RUNNER_TEMP/signing-probe.txt"
          echo "A usable Arch Browser private signing key and passphrase are configured."

      - name: Install CEF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang pkg-config libgtk-3-dev curl dpkg \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libgbm1 libasound2t64 \
            libx11-xcb1 libxcb-dri3-0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libxrender1 libxtst6

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --all-targets

      - name: Check all targets
        run: cargo check --all-targets

      - name: Build release executable
        run: cargo build --release --bin arch-browser

      - name: Build and inspect Debian package
        run: bash packaging/build-deb.sh

      - name: Sign Debian package and verify signature
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import >/dev/null 2>&1
          FINGERPRINT="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          PACKAGE="dist/arch-browser_0.1.2_amd64.deb"
          test -s "$PACKAGE"
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "${APT_GPG_PASSPHRASE:-}" \
            --local-user "$FINGERPRINT" --armor --detach-sign \
            --output "$PACKAGE.asc" "$PACKAGE"
          gpg --batch --verify "$PACKAGE.asc" "$PACKAGE"
          gpg --batch --armor --export "$FINGERPRINT" > dist/arch-browser-release-key.asc
          sha256sum "$PACKAGE" > "$PACKAGE.sha256"
          echo "Debian package signature verified."
          sha256sum --check "$PACKAGE.sha256"

      - name: Upload signed Debian package and verification files
        uses: actions/upload-artifact@v4
        with:
          name: arch-browser-deb-amd64-signed
          path: |
            dist/arch-browser_0.1.2_amd64.deb
            dist/arch-browser_0.1.2_amd64.deb.asc
            dist/arch-browser_0.1.2_amd64.deb.sha256
            dist/arch-browser-release-key.asc
          if-no-files-found: error
          retention-days: 30
