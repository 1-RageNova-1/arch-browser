name: Linux CI

on:
  push:
    branches: [main, "work/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install CEF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang pkg-config libgtk-3-dev curl dpkg \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libgbm1 libasound2t64 \
            libx11-xcb1 libxcb-dri3-0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libxrender1 libxtst6

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --all-targets

      - name: Check all targets
        run: cargo check --all-targets

      - name: Build release executable
        run: cargo build --release --bin arch-browser

      - name: Build and inspect Debian package
        run: bash packaging/build-deb.sh

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: arch-browser-deb-amd64
          path: dist/arch-browser_0.1.2_amd64.deb
          if-no-files-found: error
          retention-days: 30
